#INTERNAL - do not edit. Config migration version used to force-sync defaults we changed.
#内部配置迁移版本【请勿手动修改】，用于强制同步我们修改过的默认值
#Range: > 0
configVersion = 3

#Skill Point Converter: FE consumed per 1 skill point (100M = 100000000)
#技能点转换机：每消耗多少 FE 能量转换 1 点技能点
[machine]
	#FE per 1 skill point. Progress resets if energy input stops for >1s.
	#每 1 点技能点所需能量（FE）
	#Range: 1 ~ 9223372036854775807
	energyPerSkillPoint = 100000000
	#Staircase cost: starting cost per point (FE, default 10K) for fast early leveling.
	#阶梯消耗：起始每点消耗（FE，默认 1 万）
	#Range: 1 ~ 9223372036854775807
	energyStartCost = 10000
	#Staircase cost: ramps linearly from start to final cost within the first N points (default 2000), then stays final.
	#阶梯消耗：前 N 点内线性递增到最终值
	#Range: 1 ~ 1000000
	energyStepPoints = 2000
	#Converter: max energy input per tick (FE/t, default 100000). GUI "Unlimited Input" ignores this.
	#技能点转换机：每 tick 最大输入能量
	#Range: 1 ~ 9223372036854775807
	machineMaxInputRate = 100000
	#Converter: energy buffer cap (FE, 64-bit Long.MAX_VALUE = 9223372036854775807); stops receiving at cap.
	#技能点转换机：能量缓冲上限
	#Range: 1 ~ 9223372036854775807
	machineEnergyCapacity = 9223372036854775807
	#Converter GUI progress bar color (ARGB, starlight blue 0xFF4FC3F7 default).
	#机器界面进度条颜色
	#Range: > -2147483648
	machineProgressColor = -11549705

#Skill tree screen style
#技能树界面样式
[skillTree]
	#Skill tree background (ARGB, light gray 0xFFBEBEBE; must be fully opaque).
	#技能树界面背景色
	#Range: > -2147483648
	skillTreeBackgroundColor = -4276546
	#Skill tree border color (ARGB, light blue 0xFF87CEEB).
	#技能树界面边框色
	#Range: > -2147483648
	skillTreeBorderColor = -7876885
	#Whether the attribute panel is visible (toggle in the panel top-right corner).
	#属性面板是否显示
	panelVisible = true
	#Attribute panel position (0=right, 1=bottom; Shift+click the panel toggle to switch).
	#属性面板位置
	#Range: 0 ~ 1
	panelPosition = 0
	#Compress the vanilla heart bar when max health is above 20 (skill-boosted HP can reach tens of thousands,
	#and vanilla draws one heart per 2 HP -> massive lag). Only the values fed to vanilla rendering are
	#scaled (vanilla rendering code is untouched, so other health-bar mods keep working).
	#Set false to restore exact vanilla behaviour.
	#最大生命超过 20 时压缩原版血条（技能血量可达数万，原版每 2 点血 1 颗心 -> 严重卡顿）。
	#仅压缩“喂给原版渲染的数值”，不改原版渲染代码（兼容其他血条模组）。设 false 恢复原版行为。
	healthBarCompress = false
	#Show the real health number to the left of the hearts (e.g. 51510.0 / 51510.0) when health is compressed.
	#Reads the real vanilla values, so it includes HP added by other mods/equipment/potions.
	#压缩血条时在血条左侧显示真实血量数字（例 51510.0 / 51510.0）。读取原版实时值，
	#自动包含其他模组/装备/药水增加的生命值。
	healthNumberEnabled = false
	#Attribute panel data source: true = read live vanilla attribute values (includes equipment, potions and
	#other mods' modifiers), false = old behaviour (skill bonuses only, no external modifiers).
	#属性面板数据源：true=读取原版实时属性值（含装备/药水/其他模组加成），false=旧行为（仅技能计算值）。
	panelUseVanillaAttributes = true

