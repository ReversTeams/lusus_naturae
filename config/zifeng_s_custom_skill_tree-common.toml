	#Zone job: target max total tick time in ms (default 45; higher = faster large zones but higher MSPT. 50ms is the hard limit - beyond it TPS drops)
	#选区作业：每 tick 总耗时上限（毫秒，默认 45；调大=大选区更快但 MSPT 更高；50ms 是硬上限，超过会掉 TPS）
	#Range: 10 ~ 48
	zoneMspLimitMs = 45
	#Zone batching: side length (blocks) of one batch on the X-Z plane, full height.
	#A zone is split into batchSide x batchSide columns and processed batch by batch,
	#so memory and per-tick load stay flat no matter how large the zone is.
	#Smaller = smoother but more batch switches; 64 keeps one batch at 64 x 64 x worldHeight.
	#选区分批：单个批次在 X-Z 平面上的边长（格），Y 方向不分批（全高）。
	#选区会被切成 batchSide x batchSide 根柱逐批处理 → 内存与单 tick 负载不随选区面积增长。
